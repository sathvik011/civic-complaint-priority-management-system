<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Submit New Complaint</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="geo.js"></script>
    <!--
        Image upload logic runs here (synchronous, before app.js DOMContentLoaded).
        app.js is deferred so it fires after DOM is ready — the window helpers
        defined below are available to it by that time.
    -->
    <script>
    // ---- Image Upload Logic ----
    // These helpers are exposed globally so app.js can call
    // window.getSelectedImagesBase64() during complaint submission.

    let selectedFiles = [];

    window.getSelectedImagesBase64 = async function () {
        const toBase64 = file => new Promise((res, rej) => {
            const r = new FileReader();
            r.onload = () => res(r.result); // data URL: "data:image/jpeg;base64,..."
            r.onerror = rej;
            r.readAsDataURL(file);
        });
        return Promise.all(selectedFiles.map(toBase64));
    };

    window.removeImage = function (i) {
        selectedFiles.splice(i, 1);
        renderPreviews();
    };

    // ---- Video Upload Logic ----
    let selectedVideoFiles = [];

    window.getSelectedVideosBase64 = async function () {
        const toBase64 = file => new Promise((res, rej) => {
            const r = new FileReader();
            r.onload = () => res(r.result); // data URL: "data:video/mp4;base64,..."
            r.onerror = rej;
            r.readAsDataURL(file);
        });
        return Promise.all(selectedVideoFiles.map(toBase64));
    };

    window.removeVideo = function (i) {
        selectedVideoFiles.splice(i, 1);
        renderVideoPreviews();
    };

    function handleVideoFiles(files) {
        const videoFiles = [...files].filter(
            f => f.type.startsWith('video/') && f.size <= 50 * 1024 * 1024
        );
        const remaining = 3 - selectedVideoFiles.length;
        const toAdd = videoFiles.slice(0, remaining);
        if (videoFiles.length > remaining) {
            alert(`Max 3 videos allowed. Only the first ${remaining} were added.`);
        }
        selectedVideoFiles.push(...toAdd);
        renderVideoPreviews();
    }

    function renderVideoPreviews() {
        const grid = document.getElementById('videoPreviewGrid');
        if (!grid) return;
        grid.innerHTML = '';
        selectedVideoFiles.forEach((file, i) => {
            const url = URL.createObjectURL(file);
            const wrap = document.createElement('div');
            wrap.style.cssText = 'position:relative;width:140px;height:90px;border-radius:8px;overflow:hidden;border:1px solid #ddd;flex-shrink:0;background:#000;';
            wrap.innerHTML = `
                <video src="${url}" style="width:100%;height:100%;object-fit:cover;" muted playsinline></video>
                <div style="
                    position:absolute;bottom:0;left:0;right:0;
                    background:rgba(0,0,0,0.55);color:#fff;
                    font-size:0.7em;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
                ">${file.name}</div>
                <button onclick="removeVideo(${i})" title="Remove" style="
                    position:absolute;top:3px;right:3px;
                    background:rgba(0,0,0,0.55);color:#fff;border:none;border-radius:50%;
                    width:20px;height:20px;font-size:12px;cursor:pointer;line-height:1;padding:0;
                ">✕</button>`;
            grid.appendChild(wrap);
        });
    }

    function handleFiles(files) {
        const imageFiles = [...files].filter(
            f => f.type.startsWith('image/') && f.size <= 5 * 1024 * 1024
        );
        const remaining = 5 - selectedFiles.length;
        const toAdd = imageFiles.slice(0, remaining);
        if (imageFiles.length > remaining) {
            alert(`Max 5 images allowed. Only the first ${remaining} were added.`);
        }
        selectedFiles.push(...toAdd);
        renderPreviews();
    }

    function renderPreviews() {
        const grid = document.getElementById('imagePreviewGrid');
        if (!grid) return;
        grid.innerHTML = '';
        selectedFiles.forEach((file, i) => {
            const url = URL.createObjectURL(file);
            const wrap = document.createElement('div');
            wrap.style.cssText = 'position:relative;width:90px;height:90px;border-radius:8px;overflow:hidden;border:1px solid #ddd;flex-shrink:0;';
            wrap.innerHTML = `
                <img src="${url}" style="width:100%;height:100%;object-fit:cover;" />
                <button onclick="removeImage(${i})" title="Remove" style="
                    position:absolute;top:3px;right:3px;
                    background:rgba(0,0,0,0.55);color:#fff;border:none;border-radius:50%;
                    width:20px;height:20px;font-size:12px;cursor:pointer;line-height:1;padding:0;
                ">✕</button>`;
            grid.appendChild(wrap);
        });
    }

    // Wire up drop zone after DOM is ready
    document.addEventListener('DOMContentLoaded', () => {
        const dropZone  = document.getElementById('dropZone');
        const fileInput = document.getElementById('complaint-images');
        const browseLink = document.getElementById('browseLink');
        if (!dropZone || !fileInput) return;

        // "Browse" text — open picker
        browseLink.addEventListener('click', e => {
            e.stopPropagation(); // prevent dropZone click from also firing
            fileInput.click();
        });

        // Clicking the zone itself also opens picker (but not if already clicking browse)
        dropZone.addEventListener('click', () => fileInput.click());

        // Drag-over highlight
        dropZone.addEventListener('dragover', e => {
            e.preventDefault();
            dropZone.classList.add('drop-active');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drop-active'));

        // Drop
        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.classList.remove('drop-active');
            handleFiles(e.dataTransfer.files);
        });

        // File input change (browse dialog)
        fileInput.addEventListener('change', () => {
            handleFiles(fileInput.files);
            fileInput.value = ''; // reset so same file can be re-added after removal
        });

        // ---- Video Drop Zone Wiring ----
        const videoDropZone  = document.getElementById('videoDropZone');
        const videoFileInput = document.getElementById('complaint-videos');
        const videoBrowseLink = document.getElementById('videoBrowseLink');
        if (!videoDropZone || !videoFileInput) return;

        videoBrowseLink.addEventListener('click', e => {
            e.stopPropagation();
            videoFileInput.click();
        });

        videoDropZone.addEventListener('click', () => videoFileInput.click());

        videoDropZone.addEventListener('dragover', e => {
            e.preventDefault();
            videoDropZone.classList.add('drop-active');
        });
        videoDropZone.addEventListener('dragleave', () => videoDropZone.classList.remove('drop-active'));

        videoDropZone.addEventListener('drop', e => {
            e.preventDefault();
            videoDropZone.classList.remove('drop-active');
            handleVideoFiles(e.dataTransfer.files);
        });

        videoFileInput.addEventListener('change', () => {
            handleVideoFiles(videoFileInput.files);
            videoFileInput.value = '';
        });
    });
    </script>
    <style>
  .form-card { background: #60A5FA !important; }
  .form-card h2, .form-card label { color: #1E3A8A !important; }
  .form-card input, .form-card textarea { background: #EFF6FF !important; color: #000000 !important; border-color: #1E3A8A !important; }
  .form-card input::placeholder, .form-card textarea::placeholder { color: #6B7280 !important; }
  .form-card .btn-outline { background: #1E3A8A !important; color: #fff !important; border-color: #1E3A8A !important; }
  .form-card a { color: #fff !important; }
</style>
    <script src="app.js" defer></script>
</head>
<body>
<header class="site-header">
    <div class="container header-row">
        <a href="index.html" class="brand">Civic Complaint System</a>
        <nav class="nav">
            <a href="citizen-dashboard.html">My complaints</a>
            <a href="index.html">Logout</a>
        </nav>
    </div>
</header>

<main class="container form-page">
    <div class="card form-card wide">
        <h2>New Complaint</h2>
        <form id="complaintForm">
            <label>
                Title
                <input id="complaint-title" type="text" required placeholder="Short title" />
            </label>
            <label>
                Description
                <textarea id="complaint-desc" required placeholder="Describe the issue"></textarea>
            </label>
            <label>
                Location
                <input id="complaint-location" type="text" required placeholder="Complaint location" />
            </label>

            <!-- Photo upload -->
            <label>
                Photos
                <span style="font-weight:400;font-size:0.85em;color:#666;"> (optional, up to 5 images)</span>
            </label>
            <div id="dropZone" style="
                border: 2px dashed #aaa;
                border-radius: 10px;
                padding: 24px;
                text-align: center;
                cursor: pointer;
                background: #fafafa;
                transition: border-color 0.2s, background 0.2s;
                margin-bottom: 12px;
            ">
                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24"
                    fill="none" stroke="#999" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                    style="margin:0 auto 8px;display:block;">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                </svg>
                <p style="color:#888;margin:0;font-size:0.9em;">
                    Drag &amp; drop images here, or
                    <strong id="browseLink" style="color:#555;cursor:pointer;">browse</strong>
                </p>
                <p style="color:#bbb;font-size:0.78em;margin:4px 0 0;">JPG, PNG, WEBP — max 5 MB each</p>
                <!-- Hidden file input -->
                <input type="file" id="complaint-images" accept="image/*" multiple style="display:none;" />
            </div>

            <!-- Image preview grid -->
            <div id="imagePreviewGrid" style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;"></div>

            <!-- Video upload -->
            <label>
                Videos
                <span style="font-weight:400;font-size:0.85em;color:#666;"> (optional, up to 3 videos)</span>
            </label>
            <div id="videoDropZone" style="
                border: 2px dashed #aaa;
                border-radius: 10px;
                padding: 24px;
                text-align: center;
                cursor: pointer;
                background: #fafafa;
                transition: border-color 0.2s, background 0.2s;
                margin-bottom: 12px;
            ">
                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24"
                    fill="none" stroke="#999" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                    style="margin:0 auto 8px;display:block;">
                    <polygon points="23 7 16 12 23 17 23 7"/>
                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
                </svg>
                <p style="color:#888;margin:0;font-size:0.9em;">
                    Drag &amp; drop videos here, or
                    <strong id="videoBrowseLink" style="color:#555;cursor:pointer;">browse</strong>
                </p>
                <p style="color:#bbb;font-size:0.78em;margin:4px 0 0;">MP4, MOV, WEBM — max 50 MB each</p>
                <input type="file" id="complaint-videos" accept="video/*" multiple style="display:none;" />
            </div>

            <!-- Video preview grid -->
            <div id="videoPreviewGrid" style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;"></div>

            <div class="form-row">
                <button type="submit" class="btn btn-primary">Submit Complaint</button>
                <a href="citizen-dashboard.html" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</main>

<style>
/* Drop zone active state */
#dropZone.drop-active {
    border-color: #4a90e2;
    background: #f0f6ff;
}
</style>
</body>
</html>
