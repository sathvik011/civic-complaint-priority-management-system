<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="geo.js"></script>
  <script src="app.js" defer></script>
  <style>
    body {
      background: linear-gradient(135deg, #1E3A8A 0%, #2563EB 50%, #1e4db5 100%);
      min-height: 100vh;
      font-family: 'DM Sans', sans-serif;
    }

    .site-header {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.15);
      padding: 16px 0;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .site-header .brand {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.4rem;
      color: #fff;
    }

    .site-header .nav a {
      color: rgba(255,255,255,0.85);
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      padding: 8px 18px;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .site-header .nav a:hover {
      background: rgba(255,255,255,0.18);
      color: #fff;
    }

    /* ── Page Wrapper ── */
    .page-wrapper {
      width: 92%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 0 60px;
    }

    /* ── Welcome Banner ── */
    .welcome-banner {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 32px 36px;
      margin-bottom: 28px;
      backdrop-filter: blur(8px);
    }

    .welcome-banner h2 {
      font-family: 'Syne', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      color: #fff;
      margin: 0 0 8px;
    }

    #welcomeAdmin {
      color: rgba(255,255,255,0.7);
      font-size: 0.95rem;
      margin: 0;
    }

    /* ── Controls Card ── */
    .controls-card {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 20px;
      backdrop-filter: blur(8px);
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .ctrl-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 160px;
    }

    .ctrl-group label {
      font-family: 'Syne', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      color: #93C5FD;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .ctrl-group select {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 10px;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      padding: 10px 14px;
      outline: none;
      transition: all 0.2s;
      cursor: pointer;
    }

    .ctrl-group select:focus {
      border-color: rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.2);
    }

    .ctrl-group select option {
      background: #1E3A8A;
      color: #fff;
    }

    /* ── Table Card ── */
    .table-card {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 20px;
      overflow: hidden;
      backdrop-filter: blur(8px);
    }

    .table-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      min-width: 1200px;
      border-collapse: collapse;
      background: transparent;
      box-shadow: none;
      border-radius: 0;
    }

    table th {
      background: rgba(255,255,255,0.08);
      color: #93C5FD;
      font-family: 'Syne', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 16px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      white-space: nowrap;
    }

    table td {
      padding: 15px 18px;
      color: rgba(255,255,255,0.85);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      vertical-align: middle;
    }

    table tr:last-child td { border-bottom: none; }

    table tr { transition: background 0.2s; }

    table tr:hover td { background: rgba(255,255,255,0.06); color: #1E3A8A; }

    /* ── Status Badges ── */
    .status {
      display: inline-block;
      padding: 5px 13px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 700;
      font-family: 'Syne', sans-serif;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .status-registered  { background: rgba(245,158,11,0.25); color: #FCD34D; border: 1px solid rgba(245,158,11,0.4); }
    .status-in-progress { background: rgba(59,130,246,0.25);  color: #93C5FD; border: 1px solid rgba(59,130,246,0.4); }
    .status-resolved    { background: rgba(16,185,129,0.25);  color: #6EE7B7; border: 1px solid rgba(16,185,129,0.4); }

    /* ── Status Dropdown in table ── */
    table select {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 8px;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.83rem;
      padding: 7px 12px;
      outline: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    table select:focus {
      border-color: rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.22);
      color: #1E3A8A;
    }

    table select option {
      background: #1E3A8A;
      color: #fff;
    }

    /* ── Delete Button ── */
    table button:not(.btn-imgs) {
      background: rgba(239,68,68,0.2);
      border: 1px solid rgba(239,68,68,0.4);
      color: #FCA5A5;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    table button:not(.btn-imgs):hover {
      background: #EF4444;
      color: #fff;
    }

    /* ── Photo / Video Buttons ── */
    .btn-imgs {
      background: rgba(147,197,253,0.2);
      border: 1px solid rgba(147,197,253,0.35);
      color: #BFDBFE;
      border-radius: 8px;
      padding: 7px 13px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .btn-imgs:hover {
      background: rgba(147,197,253,0.35);
      color: #1E3A8A;
    }

    /* ── Priority Badges ── */
    .priority-1 { color: #FCA5A5; font-weight: 700; }
    .priority-2 { color: #FCD34D; font-weight: 700; }
    .priority-3 { color: #6EE7B7; font-weight: 700; }

    @media (max-width: 768px) {
      .controls-card { flex-direction: column; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container header-row">
      <a href="index.html" class="brand">Civic Complaint System</a>
      <nav class="nav">
        <a href="index.html">Logout</a>
      </nav>
    </div>
  </header>

  <div class="page-wrapper">

    <!-- Welcome Banner -->
    <div class="welcome-banner">
      <h2>All Complaints</h2>
      <p id="welcomeAdmin"></p>
    </div>

    <!-- Controls -->
    <div class="controls-card">
      <div class="ctrl-group">
        <label for="adminSort">Sort by</label>
        <select id="adminSort">
          <option value="date">Date</option>
          <option value="priority">Priority</option>
          <option value="location">Location</option>
          <option value="department">Department</option>
          <option value="status">Status</option>
        </select>
      </div>
    </div>

    <!-- Table -->
    <div class="table-card">
      <div class="table-scroll">
        <table id="adminComplaintsTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Title</th>
              <th>Description</th>
              <th>Location</th>
              <th>Department</th>
              <th>User</th>
              <th>Priority</th>
              <th>Date Registered</th>
              <th>Resolved Date</th>
              <th>Status</th>
              <th>Photos</th>
              <th>Videos</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="adminComplaintsBody"></tbody>
        </table>
      </div>
    </div>

  </div>

</body>
</html>
